tasks:
  install-deps:
    name: Install dependencies
    description: Install Python dependencies from requirements.txt.
    command: |
      pip install -r requirements.txt
    triggeredBy:
      - postDevcontainerStart

  init-db:
    name: Initialize database
    description: Wait for PostgreSQL and create application tables.
    command: |
      until pg_isready -h localhost -p 5432 -U gitpod; do
        echo "Waiting for PostgreSQL..."
        sleep 1
      done
      PGPASSWORD=gitpod psql -h localhost -U gitpod -d postgres -tc \
        "SELECT 1 FROM pg_database WHERE datname = 'onaflix_admin'" \
        | grep -q 1 \
        || PGPASSWORD=gitpod createdb -h localhost -U gitpod onaflix_admin
      python -c "from app import create_app, db; app = create_app(); app.app_context().push(); db.create_all(); print('Tables created.')"
    triggeredBy:
      - postDevcontainerStart
    dependsOn:
      - install-deps

services:
  postgres:
    name: PostgreSQL
    description: PostgreSQL 16 database server running in Docker.
    commands:
      start: |
        docker run --rm --name onaflix-postgres \
          -e POSTGRES_USER=gitpod \
          -e POSTGRES_PASSWORD=gitpod \
          -p 5432:5432 \
          postgres:16-alpine
      ready: |
        pg_isready -h localhost -p 5432 -U gitpod
      stop: |
        docker stop onaflix-postgres

  flask-app:
    name: Flask Dev Server
    description: Flask development server on port 5000.
    commands:
      start: |
        until pg_isready -h localhost -p 5432 -U gitpod; do
          echo "Waiting for PostgreSQL..."
          sleep 1
        done
        python run.py
      ready: |
        curl -sf http://localhost:5000/health
