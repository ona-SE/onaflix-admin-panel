tasks:
  install-deps:
    name: Install dependencies
    description: Install Python dependencies from requirements.txt.
    command: |
      pip install -r requirements.txt
    triggeredBy:
      - postDevcontainerStart

  init-db:
    name: Initialize database
    description: Wait for PostgreSQL and create the application database schema.
    command: |
      until docker exec onaflix-postgres pg_isready -U gitpod; do
        echo "Waiting for PostgreSQL..."
        sleep 1
      done
      PGPASSWORD=gitpod psql -h localhost -U gitpod -d onaflix_admin -c "SELECT 1" 2>/dev/null || true
      python -c "
      from app import create_app, db
      app = create_app()
      with app.app_context():
          db.create_all()
          print('Database tables created.')
      "
    triggeredBy:
      - postDevcontainerStart
    dependsOn:
      - install-deps

services:
  postgres:
    name: PostgreSQL
    description: PostgreSQL 16 database server for the admin panel.
    commands:
      start: |
        docker run --rm --name onaflix-postgres \
          -e POSTGRES_USER=gitpod \
          -e POSTGRES_PASSWORD=gitpod \
          -e POSTGRES_DB=onaflix_admin \
          -p 5432:5432 \
          postgres:16
      ready: |
        docker exec onaflix-postgres pg_isready -U gitpod
      stop: |
        docker stop onaflix-postgres

  flask-app:
    name: Flask Dev Server
    description: Flask development server on port 5000.
    commands:
      start: |
        python run.py
      ready: |
        curl -sf http://localhost:5000/health
